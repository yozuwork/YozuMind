<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YoZu 心智圖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --font:"Manrope","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --side-bg:#f7f6f3; --side-hover:rgba(55,53,47,.07); --side-active:rgba(55,53,47,.11);
  --side-ink:#37352f; --side-ink-2:#7d7b75; --line:#e8e6e1;
  --main-bg:#ffffff; --canvas:#f2f4f7; --dot:#c9d1db;
  --ink:#1b2530; --ink-2:#4a5866; --ph:#9aa6b2;
  --root-bg:#273342; --root-ink:#ffffff;
  --panel:#ffffff; --panel-line:#e1e5ea; --panel-hover:#f1f3f6;
  --shadow:0 8px 28px rgba(16,24,32,.14);
  --accent:#1767c9; --danger:#c62f3a; --ok:#2f8a4c;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --side-bg:#1f1f1f; --side-hover:rgba(255,255,255,.055); --side-active:rgba(255,255,255,.1);
    --side-ink:#e5e5e2; --side-ink-2:#9b9a96; --line:#2e2e2e;
    --main-bg:#191919; --canvas:#0f171f; --dot:#26323d;
    --ink:#eef2f6; --ink-2:#b3bfcb; --ph:#5f6e7c;
    --root-bg:#283442; --root-ink:#f4f7fa;
    --panel:#222b35; --panel-line:#344050; --panel-hover:#2b3641;
    --shadow:0 10px 30px rgba(0,0,0,.5);
    --accent:#5ea2f2; --danger:#ff6f78; --ok:#5cc985;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --side-bg:#1f1f1f; --side-hover:rgba(255,255,255,.055); --side-active:rgba(255,255,255,.1);
  --side-ink:#e5e5e2; --side-ink-2:#9b9a96; --line:#2e2e2e;
  --main-bg:#191919; --canvas:#0f171f; --dot:#26323d;
  --ink:#eef2f6; --ink-2:#b3bfcb; --ph:#5f6e7c;
  --root-bg:#283442; --root-ink:#f4f7fa;
  --panel:#222b35; --panel-line:#344050; --panel-hover:#2b3641;
  --shadow:0 10px 30px rgba(0,0,0,.5);
  --accent:#5ea2f2; --danger:#ff6f78; --ok:#5cc985;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--main-bg);color:var(--side-ink);font-family:var(--font);font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,.canvas:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.canvas:focus-visible{outline:none}

.app{display:flex;height:100%;position:relative}

/* ---------- Sidebar (Notion-like) ---------- */
.side{width:256px;flex:none;background:var(--side-bg);border-right:1px solid var(--line);display:flex;flex-direction:column;transition:margin-left .18s ease, transform .18s ease;z-index:20;min-height:0}
.app.side-closed .side{margin-left:-256px}
.ws{display:flex;align-items:center;gap:8px;padding:12px 12px 8px 14px}
.ws-mark{width:22px;height:22px;border-radius:5px;background:var(--root-bg);color:var(--root-ink);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.ws-name{font-weight:600;font-size:14px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--side-ink-2);flex:none}
.icon-btn:hover{background:var(--side-hover);color:var(--side-ink)}
.search{margin:4px 8px 2px;display:flex;align-items:center;gap:6px;padding:0 8px;height:30px;border-radius:6px;color:var(--side-ink-2)}
.search:focus-within{background:var(--side-hover)}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;color:var(--side-ink);outline:none}
.search input::placeholder{color:var(--side-ink-2)}
.side-act{margin:0 8px;display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;border-radius:6px;color:var(--side-ink-2);width:calc(100% - 16px);text-align:left}
.side-act:hover{background:var(--side-hover);color:var(--side-ink)}
.side-act[disabled]{opacity:.45;cursor:default;background:none}
.sec{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 4px;color:var(--side-ink-2);font-size:12px;font-weight:600}
.pages{flex:1;overflow-y:auto;padding:0 8px 8px;min-height:0}
.page{display:flex;align-items:center;gap:8px;height:30px;padding:0 4px 0 8px;border-radius:6px;cursor:pointer;color:var(--side-ink);position:relative}
.page:hover{background:var(--side-hover)}
.page.active{background:var(--side-active);font-weight:600}
.page .pi{width:20px;text-align:center;flex:none;font-size:15px}
.page .pt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page .more{opacity:0;width:24px;height:24px}
.page:hover .more,.page.active .more,.page .more:focus-visible{opacity:1}
.no-pages{padding:8px 12px;color:var(--side-ink-2);font-size:13px;line-height:1.5}
.side-foot{border-top:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:8px;color:var(--side-ink-2);font-size:12px}
.dotst{width:7px;height:7px;border-radius:50%;background:var(--side-ink-2);flex:none}
.dotst.ok{background:var(--ok)}
.dotst.busy{background:#d8a424}
.scrim{display:none}

/* ---------- Main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--main-bg)}
.topbar{height:46px;flex:none;display:flex;align-items:center;gap:6px;padding:0 10px;border-bottom:1px solid var(--line);color:var(--side-ink)}
.topbar .icon-btn{color:var(--side-ink-2)}
.crumb-icon{width:30px;height:30px;border-radius:6px;font-size:18px;display:grid;place-items:center;flex:none}
.crumb-icon:hover{background:var(--side-hover)}
.title-input{flex:1;min-width:60px;border:0;background:none;font:inherit;font-size:15px;font-weight:600;color:var(--side-ink);padding:5px 6px;border-radius:5px;outline:none;text-overflow:ellipsis}
.title-input:hover{background:var(--side-hover)}
.title-input:focus{background:var(--side-hover)}
.seg{display:flex;background:var(--side-hover);border-radius:7px;padding:2px;flex:none}
.seg button{height:26px;padding:0 9px;border-radius:5px;color:var(--side-ink-2);font-size:13px;display:flex;align-items:center;gap:4px}
.seg button.on{background:var(--main-bg);color:var(--side-ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.btn{height:30px;padding:0 12px;border-radius:6px;font-weight:600;font-size:13px;flex:none}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{color:var(--side-ink)}
.btn-ghost:hover{background:var(--side-hover)}
.ro-badge{font-size:12px;color:var(--side-ink-2);padding:3px 8px;border:1px solid var(--line);border-radius:999px;flex:none}

/* ---------- Canvas ---------- */
.canvas{flex:1;position:relative;overflow:hidden;background-color:var(--canvas);background-image:radial-gradient(circle, var(--dot) 1.1px, transparent 1.5px);background-size:24px 24px;touch-action:none;outline:none;cursor:default}
.canvas.panning{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#edges path{fill:none;stroke-linecap:round}
#edges .chip{pointer-events:auto;cursor:pointer}
#edges .chip text{font-family:var(--font);font-size:11px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:central}

.node{position:absolute;left:0;top:0;width:max-content;white-space:pre-wrap;word-break:break-word;max-width:300px;line-height:1.3;padding:6px 10px;border-radius:8px;color:var(--ink);font-size:16px;font-weight:500;user-select:none;-webkit-user-select:none;cursor:pointer;outline:none}
.node.root{font-size:30px;font-weight:600;padding:22px 40px;background:var(--root-bg);color:var(--root-ink);border-radius:10px;max-width:420px;letter-spacing:.01em}
.node.l1{font-size:22px;font-weight:500}
.node.l2{font-size:16px;color:var(--ink-2)}
.node:empty::before{content:attr(data-ph);color:var(--ph)}
.node.root:empty::before{color:rgba(255,255,255,.45)}
.node.sel{box-shadow:0 0 0 2px var(--c)}
.node.l1.sel,.node.l2.sel{background:color-mix(in srgb, var(--c) 14%, transparent)}
.node.editing{cursor:text;user-select:text;-webkit-user-select:text;box-shadow:0 0 0 2px var(--c);background:var(--panel)}
.node.root.editing{background:var(--root-bg)}
.node.dragging{opacity:.35}
.node.drop{box-shadow:0 0 0 2px var(--c), 0 0 0 6px color-mix(in srgb, var(--c) 30%, transparent)}
#measure{position:absolute;left:-9999px;top:-9999px;visibility:hidden;pointer-events:none}
.ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:60;padding:6px 12px;border-radius:8px;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-weight:600;font-size:15px;max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* node toolbar */
.nodebar{position:absolute;z-index:10;display:none;align-items:center;gap:2px;padding:4px;border-radius:9px;background:var(--panel);border:1px solid var(--panel-line);box-shadow:var(--shadow);color:var(--ink)}
.nodebar.show{display:flex}
.nodebar button{height:30px;min-width:30px;padding:0 8px;border-radius:6px;display:flex;align-items:center;gap:5px;font-size:13px;white-space:nowrap}
.nodebar button:hover{background:var(--panel-hover)}
.nodebar .sep{width:1px;height:18px;background:var(--panel-line);margin:0 2px}
.nodebar .del:hover{color:var(--danger)}
.swatch-dot{width:14px;height:14px;border-radius:50%;background:var(--c);display:inline-block}
.swatches{display:none;gap:6px;padding:4px 6px}
.nodebar.colors .swatches{display:flex}
.nodebar.colors .tools{display:none}
.tools{display:flex;align-items:center;gap:2px}
.swatches button{width:24px;height:24px;min-width:24px;padding:0;border-radius:50%;background:var(--c);border:2px solid transparent}
.swatches button.on{border-color:var(--ink)}

.zoombar{position:absolute;right:14px;bottom:14px;display:flex;align-items:center;gap:2px;padding:3px;border-radius:9px;background:var(--panel);border:1px solid var(--panel-line);box-shadow:var(--shadow);color:var(--ink);z-index:5}
.zoombar button{height:28px;min-width:28px;padding:0 6px;border-radius:6px;font-size:13px}
.zoombar button:hover{background:var(--panel-hover)}
.zoombar .zl{min-width:48px;font-variant-numeric:tabular-nums}
.hint{position:absolute;left:14px;bottom:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:12px;color:var(--ink-2);z-index:5;pointer-events:none}
.hint span{display:flex;align-items:center;gap:5px}
kbd{font-family:var(--font);font-size:11px;padding:1px 6px;border-radius:4px;border:1px solid var(--panel-line);background:var(--panel);color:var(--ink)}

.empty-state{position:absolute;inset:0;display:none;place-items:center;z-index:4;padding:20px}
.empty-state.show{display:grid}
.empty-card{max-width:360px;text-align:center;color:var(--ink)}
.empty-card h2{font-size:22px;margin:0 0 8px;font-weight:700}
.empty-card p{margin:0 0 18px;color:var(--ink-2);line-height:1.6}
.empty-card .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.empty-card .btn-ghost{border:1px solid var(--panel-line);background:var(--panel)}

/* popovers */
.pop{position:fixed;z-index:50;min-width:180px;padding:5px;border-radius:9px;background:var(--panel);border:1px solid var(--panel-line);box-shadow:var(--shadow);color:var(--ink);display:none}
.pop.show{display:block}
.pop .mi{display:flex;align-items:center;gap:9px;width:100%;height:32px;padding:0 10px;border-radius:6px;text-align:left;font-size:13.5px}
.pop .mi:hover{background:var(--panel-hover)}
.pop .mi.danger{color:var(--danger)}
.pop .mi.danger.armed{background:var(--danger);color:#fff}
.icon-grid{display:grid;grid-template-columns:repeat(7,32px);gap:2px}
.icon-grid button{width:32px;height:32px;border-radius:6px;font-size:18px}
.icon-grid button:hover{background:var(--panel-hover)}
.share-pop{width:300px;padding:14px 16px;line-height:1.6}
.share-pop h3{margin:0 0 6px;font-size:15px}
.share-pop p{margin:0 0 8px;color:var(--ink-2);font-size:13px}
.share-pop p:last-child{margin-bottom:0}
.share-pop code{font-size:12px;background:var(--panel-hover);padding:1px 5px;border-radius:4px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--root-bg);color:var(--root-ink);padding:9px 16px;border-radius:8px;font-size:13px;z-index:70;transition:.2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:760px){
  .side{position:fixed;left:0;top:0;bottom:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:var(--shadow);margin-left:0 !important}
  .app.side-closed .side{transform:translateX(-105%)}
  .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:15;opacity:1;transition:opacity .18s}
  .app.side-closed .scrim{opacity:0;pointer-events:none}
  .hint{display:none}
  .seg .lbl{display:none}
  .share-label{display:none}
  .nodebar .lbl{display:none}
}
@media (prefers-reduced-motion: reduce){ .side,.toast,.scrim{transition:none} }
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side" aria-label="心智圖列表">
    <div class="ws">
      <div class="ws-mark">Y</div>
      <div class="ws-name">YoZu 心智圖</div>
      <button class="icon-btn" id="closeSide" title="收起側欄" aria-label="收起側欄">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M9.5 3.5 5 8l4.5 4.5M13 3.5 8.5 8l4.5 4.5"/></svg>
      </button>
    </div>
    <label class="search">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.6"/><path d="m10.5 10.5 3 3" stroke-linecap="round"/></svg>
      <input id="search" type="text" placeholder="搜尋心智圖" autocomplete="off">
    </label>
    <button class="side-act" id="newBtn">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>
      新增心智圖
    </button>
    <div class="sec"><span>心智圖</span><span id="count"></span></div>
    <div class="pages" id="pages"></div>
    <div class="side-foot"><span class="dotst" id="stDot"></span><span id="stText">載入中…</span></div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn" id="openSide" title="打開側欄" aria-label="打開側欄">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/></svg>
      </button>
      <button class="crumb-icon" id="crumbIcon" title="更換圖示" aria-label="更換圖示">🧠</button>
      <input class="title-input" id="title" type="text" placeholder="未命名心智圖" aria-label="心智圖名稱">
      <span class="ro-badge" id="roBadge" hidden>唯讀</span>
      <div class="seg" role="group" aria-label="排列方向">
        <button id="layDown" title="向下展開">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="5" y="1.5" width="6" height="4" rx="1"/><path d="M8 5.5v3M3.5 12.5V10h9v2.5"/></svg><span class="lbl">向下</span>
        </button>
        <button id="layRight" title="向右展開">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="1.5" y="5" width="4" height="6" rx="1"/><path d="M5.5 8h3M12.5 3.5H10v9h2.5"/></svg><span class="lbl">向右</span>
        </button>
      </div>
      <button class="btn btn-ghost" id="shareBtn" title="分享">
        <span style="display:flex;align-items:center;gap:6px">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 10V2.5M5 5l3-3 3 3M3 9v4h10V9"/></svg>
          <span class="share-label">分享</span>
        </span>
      </button>
    </header>

    <div class="canvas" id="canvas" tabindex="0" aria-label="心智圖畫布">
      <div class="world" id="world"><svg id="edges" width="1" height="1"></svg></div>

      <div class="nodebar" id="nodebar">
        <div class="tools">
          <button data-act="edit" title="編輯文字 (F2)"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M3 13l.6-2.6L10.8 3.2a1.4 1.4 0 0 1 2 2L5.6 12.4z"/></svg><span class="lbl">編輯</span></button>
          <button data-act="child" title="新增子節點 (Tab)"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg><span class="lbl">子節點</span></button>
          <button data-act="sibling" title="新增同層節點 (Enter)"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2.5 5h6M2.5 11h6M12 8.5v5M9.5 11h5"/></svg><span class="lbl">同層</span></button>
          <span class="sep" data-for="color"></span>
          <button data-act="color" title="分支顏色"><span class="swatch-dot" id="curSwatch"></span></button>
          <button data-act="collapse" title="收合／展開 (空白鍵)"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 6l4 4 4-4"/></svg></button>
          <span class="sep" data-for="del"></span>
          <button data-act="delete" class="del" title="刪除 (Delete)"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.5h5.8l.6-8.5"/></svg></button>
        </div>
        <div class="swatches" id="swatches"></div>
      </div>

      <div class="hint" id="hint">
        <span><kbd>Tab</kbd>子節點</span>
        <span><kbd>Enter</kbd>同層</span>
        <span><kbd>雙擊</kbd>編輯</span>
        <span><kbd>拖曳</kbd>移到其他節點下</span>
      </div>
      <div class="zoombar">
        <button id="zOut" title="縮小" aria-label="縮小">−</button>
        <button id="zLabel" class="zl" title="重設為 100%">100%</button>
        <button id="zIn" title="放大" aria-label="放大">＋</button>
        <button id="zFit" title="置中整張圖" aria-label="置中整張圖">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/></svg>
        </button>
      </div>

      <div class="empty-state" id="empty">
        <div class="empty-card">
          <h2 id="emptyTitle">載入中…</h2>
          <p id="emptyText"></p>
          <div class="row" id="emptyRow" hidden>
            <button class="btn btn-primary" id="emptyNew">新增空白心智圖</button>
            <button class="btn btn-ghost" id="emptySample">從 YoZuLife 範例開始</button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="pop" id="pageMenu" role="menu">
  <button class="mi" data-m="rename">✏️ 重新命名</button>
  <button class="mi" data-m="dup">📄 建立副本</button>
  <button class="mi danger" data-m="del">🗑️ 刪除</button>
</div>
<div class="pop" id="iconPop"><div class="icon-grid" id="iconGrid"></div></div>
<div class="pop share-pop" id="sharePop">
  <h3>分享這張心智圖</h3>
  <p id="shareText"></p>
</div>
<div class="node" id="measure"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';
const $ = s => document.getElementById(s);
const PALETTE = ['#a414b8','#1767c9','#008a77','#c9821a','#d0336f','#3f8f35'];
const ICONS = ['🧠','🌱','🍊','📚','🎯','🗺️','💡','🧩','🏛️','🎮','☕','✈️','🐱','🌙','⭐','🔥','🎨','🧭','📌','🍀','🦊'];
const LS_KEY = 'yozu-mindmap-v1';
const uid = (p) => (p||'n') + '-' + Math.random().toString(36).slice(2,10);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const isMobile = () => window.matchMedia('(max-width:760px)').matches;

const app=$('app'), canvas=$('canvas'), world=$('world'), edges=$('edges'), measurer=$('measure');
const nodebar=$('nodebar');

const store = { mode:'loading', db:null, readOnly:false };
const maps = new Map();
let currentId=null, selectedId=null, editingId=null, editOrig='', editFresh=false;
let view={x:0,y:0,k:1};
let L=new Map(), idx=new Map();
const els=new Map();
const undoS=new Map(), redoS=new Map();
const mcache=new Map();
let ready=false;

/* ---------------- persistence ---------------- */
function lsLoad(){ try{ const a=JSON.parse(localStorage.getItem(LS_KEY)||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function lsSaveAll(){ try{ localStorage.setItem(LS_KEY, JSON.stringify([...maps.values()])); }catch(e){} }

const pending=new Map(), inflight=new Set(), again=new Set(), myRevs=new Set(), retried=new Set();
function isBusy(id){ return pending.has(id)||inflight.has(id); }
function save(id, immediate){
  if(store.readOnly) return;
  const m=maps.get(id); if(!m) return;
  m.updatedAt=Date.now();
  if(store.mode!=='cloud'){ lsSaveAll(); return; }
  clearTimeout(pending.get(id));
  pending.set(id, setTimeout(()=>flush(id), immediate?0:500));
  setStatus();
}
async function flush(id){
  pending.delete(id);
  if(inflight.has(id)){ again.add(id); return; }
  const m=maps.get(id); if(!m){ setStatus(); return; }
  m.rev=uid('r'); myRevs.add(m.rev);
  inflight.add(id); setStatus();
  try{
    await store.db.doc('maps/'+id).set(JSON.parse(JSON.stringify(m)));
    retried.delete(id);
  }catch(e){ writeError(e, ()=>save(id,true), id); }
  finally{
    inflight.delete(id);
    if(again.has(id)){ again.delete(id); flush(id); } else setStatus();
  }
}
async function removeRemote(id){
  if(store.mode!=='cloud'){ lsSaveAll(); return; }
  clearTimeout(pending.get(id)); pending.delete(id);
  try{ await store.db.doc('maps/'+id).delete(); }catch(e){ writeError(e); }
}
function writeError(e, retry, id){
  const code=e&&e.code;
  if(code==='invalid_argument'||code==='not_granted'){ store.readOnly=true; applyReadOnly(); toast('你目前只有檢視權限，修改不會被儲存'); }
  else if(code==='quota_exceeded'){ toast('儲存空間已滿，刪除幾張不用的心智圖後再試'); }
  else if(code==='unavailable' && retry && !retried.has(id)){ retried.add(id); setTimeout(retry, 800+Math.random()*1200); }
  else if(code==='revoked'){ store.readOnly=true; applyReadOnly(); }
  else { toast('儲存失敗，請檢查網路後再編輯一次'); }
}
function setStatus(){
  const dot=$('stDot'), t=$('stText');
  dot.className='dotst';
  if(store.mode==='loading'){ t.textContent='載入中…'; return; }
  if(store.readOnly){ t.textContent='唯讀檢視'; return; }
  if(store.mode==='local'){ t.textContent='只儲存在這個瀏覽器'; return; }
  if(pending.size||inflight.size){ dot.classList.add('busy'); t.textContent='儲存中…'; }
  else { dot.classList.add('ok'); t.textContent='已同步到雲端'; }
}

/* ---------------- data helpers ---------------- */
function cur(){ return currentId ? maps.get(currentId) : null; }
function mkNode(text,color){ const n={id:uid('n'),text:text||'',children:[]}; if(color) n.color=color; return n; }
function makeMap(sample){
  const root = sample
    ? Object.assign(mkNode('YoZuLife'),{children:[mkNode('LIFE生活區',PALETTE[0]),mkNode('英雄習慣區',PALETTE[1]),mkNode('其他YoZU頁面',PALETTE[2])]})
    : mkNode('中心主題');
  const now=Date.now();
  return { id:uid('m'), title: sample?'YoZuLife':'未命名心智圖', icon: sample?'🍊':ICONS[Math.floor(Math.random()*ICONS.length)], layout:'down', root, createdAt:now, updatedAt:now, rev:'' };
}
function cloneWithNewIds(n){ return Object.assign({}, n, {id:uid('n'), children:(n.children||[]).map(cloneWithNewIds)}); }
function sanitize(n){ if(!n||typeof n!=='object') return mkNode(''); n.text=typeof n.text==='string'?n.text:''; n.children=Array.isArray(n.children)?n.children.map(sanitize):[]; if(!n.id) n.id=uid('n'); return n; }
function countDesc(n){ let c=0; (n.children||[]).forEach(ch=>{ c+=1+countDesc(ch); }); return c; }
function nextColor(root){
  const used=new Map(PALETTE.map(c=>[c,0]));
  root.children.forEach((c,i)=>{ const col=c.color||PALETTE[i%PALETTE.length]; if(used.has(col)) used.set(col,used.get(col)+1); });
  let best=PALETTE[0], min=Infinity; for(const [c,v] of used){ if(v<min){min=v;best=c;} } return best;
}
function isAncestor(aId, bId){ let i=idx.get(bId); while(i&&i.parent){ if(i.parent.id===aId) return true; i=idx.get(i.parent.id); } return false; }

/* ---------------- undo ---------------- */
function snapshot(){ const m=cur(); if(!m) return; const s=undoS.get(m.id)||[]; s.push(JSON.stringify(m.root)); if(s.length>80) s.shift(); undoS.set(m.id,s); redoS.set(m.id,[]); }
function dropSnapshot(){ const m=cur(); if(!m) return; const s=undoS.get(m.id); if(s) s.pop(); }
function doUndo(){ step(undoS, redoS); }
function doRedo(){ step(redoS, undoS); }
function step(from,to){
  if(store.readOnly) return; const m=cur(); if(!m) return;
  const s=from.get(m.id); if(!s||!s.length) return;
  const t=to.get(m.id)||[]; t.push(JSON.stringify(m.root)); to.set(m.id,t);
  m.root=JSON.parse(s.pop());
  renderMap(); if(!idx.has(selectedId)) { selectedId=m.root.id; renderMap(); }
  save(m.id);
}

/* ---------------- layout ---------------- */
const isDown = () => (cur()&&cur().layout)!=='right';
function lvl(d){ return d===0?'root':d===1?'l1':'l2'; }
function measure(n,d){
  const k=lvl(d)+'|'+(n.text||'輸入文字');
  let v=mcache.get(k); if(v) return v;
  measurer.className='node '+lvl(d); measurer.textContent=n.text||'輸入文字';
  const r=measurer.getBoundingClientRect(); v={w:Math.ceil(r.width), h:Math.ceil(r.height)};
  mcache.set(k,v); return v;
}
function gapSib(d){ return isDown() ? (d===1?72:30) : (d===1?30:12); }
function gapLvl(d){ return isDown() ? (d===0?120:62) : (d===0?110:56); }
function buildIndex(){
  idx=new Map(); const m=cur(); if(!m) return;
  (function walk(n,parent,depth,color){
    idx.set(n.id,{node:n,parent,depth,color});
    n.children.forEach((c,i)=>walk(c,n,depth+1, depth===0 ? (c.color||PALETTE[i%PALETTE.length]) : color));
  })(m.root,null,0,null);
}
function doLayout(){
  L=new Map(); const m=cur(); if(!m) return; const down=isDown();
  (function size(n,d){
    const s=measure(n,d); const kids=n.collapsed?[]:n.children; let tot=0;
    kids.forEach((c,i)=>{ size(c,d+1); const o=L.get(c.id); tot += down?o.sw:o.sh; if(i) tot+=gapSib(d+1); });
    L.set(n.id,{w:s.w,h:s.h,tot, sw:down?Math.max(s.w,tot):0, sh:down?0:Math.max(s.h,tot), x:0,y:0});
  })(m.root,0);
  if(down){
    (function place(n,cx,y,d){
      const o=L.get(n.id); o.x=cx-o.w/2; o.y=y; let s=cx-o.tot/2;
      (n.collapsed?[]:n.children).forEach(c=>{ const co=L.get(c.id); place(c, s+co.sw/2, y+o.h+gapLvl(d), d+1); s+=co.sw+gapSib(d+1); });
    })(m.root,0,0,0);
  } else {
    (function place(n,x,cy,d){
      const o=L.get(n.id); o.x=x; o.y=cy-o.h/2; let s=cy-o.tot/2;
      (n.collapsed?[]:n.children).forEach(c=>{ const co=L.get(c.id); place(c, x+o.w+gapLvl(d), s+co.sh/2, d+1); s+=co.sh+gapSib(d+1); });
    })(m.root,0,0,0);
  }
}

/* ---------------- render ---------------- */
function renderMap(){
  const m=cur();
  updateEmpty();
  if(!m){ for(const el of els.values()) el.remove(); els.clear(); edges.innerHTML=''; hideBar(); return; }
  buildIndex(); doLayout();
  const alive=new Set();
  for(const [id,info] of idx){
    const o=L.get(id); if(!o) continue; alive.add(id);
    let el=els.get(id);
    if(!el){ el=document.createElement('div'); el.dataset.id=id; el.dataset.ph='輸入文字'; world.appendChild(el); els.set(id,el); }
    let cls='node '+lvl(info.depth);
    if(id===selectedId) cls+=' sel';
    if(id===editingId) cls+=' editing';
    if(drag && drag.id===id) cls+=' dragging';
    if(drag && drag.target===id) cls+=' drop';
    if(el.className!==cls) el.className=cls;
    if(id!==editingId && el.textContent!==info.node.text) el.textContent=info.node.text;
    el.style.transform=`translate(${o.x}px,${o.y}px)`;
    el.style.setProperty('--c', info.color||'var(--accent)');
  }
  for(const [id,el] of els){ if(!alive.has(id)){ el.remove(); els.delete(id); } }
  drawEdges(); applyView(); placeBar();
}
function drawEdges(){
  const down=isDown(); let out='';
  for(const [id,info] of idx){
    const n=info.node, o=L.get(id); if(!o) continue;
    if(n.collapsed && n.children.length){
      const cx= down? o.x+o.w/2 : o.x+o.w+14, cy= down? o.y+o.h+14 : o.y+o.h/2;
      const col = info.depth===0 ? 'var(--ink-2)' : info.color;
      out+=`<g class="chip" data-toggle="${id}"><circle cx="${cx}" cy="${cy}" r="11" fill="${col}"/><text x="${cx}" y="${cy}">${countDesc(n)}</text></g>`;
      continue;
    }
    const kids=n.children, k=kids.length;
    kids.forEach((c,i)=>{
      const co=L.get(c.id), ci=idx.get(c.id); if(!co) return;
      const t = k>1 ? (i/(k-1)-.5) : 0;
      let d;
      if(down){
        const sx=o.x+o.w/2 + t*(info.depth===0? o.w*0.36 : 0), sy=o.y+o.h-(info.depth===0?0:3);
        const ex=co.x+co.w/2, ey=co.y+2, dy=ey-sy;
        d=`M${sx} ${sy} C${sx} ${sy+dy*.55} ${ex} ${ey-dy*.55} ${ex} ${ey}`;
      } else {
        const sx=o.x+o.w-(info.depth===0?0:3), sy=o.y+o.h/2 + t*(info.depth===0? o.h*0.4 : 0);
        const ex=co.x+2, ey=co.y+co.h/2, dx=ex-sx;
        d=`M${sx} ${sy} C${sx+dx*.55} ${sy} ${ex-dx*.55} ${ey} ${ex} ${ey}`;
      }
      out+=`<path d="${d}" stroke="${ci.color}" stroke-width="${ci.depth===1?5:3.2}"/>`;
    });
  }
  edges.innerHTML=out;
}
function applyView(){
  world.style.transform=`translate(${view.x}px,${view.y}px) scale(${view.k})`;
  const g=24*view.k;
  canvas.style.backgroundSize=`${g}px ${g}px`;
  canvas.style.backgroundPosition=`${view.x}px ${view.y}px`;
  $('zLabel').textContent=Math.round(view.k*100)+'%';
}
function bbox(){ let a=Infinity,b=Infinity,c=-Infinity,d=-Infinity; for(const o of L.values()){ a=Math.min(a,o.x); b=Math.min(b,o.y); c=Math.max(c,o.x+o.w); d=Math.max(d,o.y+o.h);} return {x0:a,y0:b,x1:c,y1:d}; }
function fit(){
  if(!L.size) return; const bb=bbox(); const cw=canvas.clientWidth, ch=canvas.clientHeight; const pad=isMobile()?32:90;
  const k=clamp(Math.min((cw-pad*2)/Math.max(1,bb.x1-bb.x0),(ch-pad*2)/Math.max(1,bb.y1-bb.y0)), .25, 1);
  view.k=k; view.x=cw/2-(bb.x0+bb.x1)/2*k; view.y=ch/2-(bb.y0+bb.y1)/2*k; applyView(); placeBar();
}
function ensureVisible(id){
  const o=L.get(id); if(!o) return; const cw=canvas.clientWidth, ch=canvas.clientHeight, m=60;
  const x0=view.x+o.x*view.k, y0=view.y+o.y*view.k, x1=x0+o.w*view.k, y1=y0+o.h*view.k;
  let dx=0, dy=0;
  if(x0<m) dx=m-x0; else if(x1>cw-m) dx=(cw-m)-x1;
  if(y0<m+40) dy=m+40-y0; else if(y1>ch-m) dy=(ch-m)-y1;
  if(dx||dy){ view.x+=dx; view.y+=dy; applyView(); placeBar(); }
}
function zoomAt(px,py,f){ const k=clamp(view.k*f,.2,2.5); f=k/view.k; view.x=px-(px-view.x)*f; view.y=py-(py-view.y)*f; view.k=k; applyView(); placeBar(); }
function zoomCenter(f){ zoomAt(canvas.clientWidth/2, canvas.clientHeight/2, f); }

/* ---------------- node toolbar ---------------- */
function hideBar(){ nodebar.classList.remove('show','colors'); }
function placeBar(){
  const info=idx.get(selectedId), o=L.get(selectedId);
  if(!info||!o||editingId||store.readOnly||drag){ hideBar(); return; }
  const showColor=info.depth>0;
  nodebar.querySelector('[data-act="color"]').style.display=showColor?'':'none';
  nodebar.querySelector('[data-for="color"]').style.display=showColor?'':'none';
  nodebar.querySelector('[data-act="collapse"]').style.display=info.node.children.length?'':'none';
  nodebar.querySelector('[data-act="delete"]').style.display=info.depth?'':'none';
  nodebar.querySelector('[data-for="del"]').style.display=info.depth?'':'none';
  nodebar.querySelector('[data-act="collapse"]').firstElementChild.style.transform=info.node.collapsed?'rotate(-90deg)':'';
  $('curSwatch').style.setProperty('--c', info.color||PALETTE[0]);
  nodebar.classList.add('show');
  const bw=nodebar.offsetWidth, bh=nodebar.offsetHeight, cw=canvas.clientWidth;
  let left=view.x+(o.x+o.w/2)*view.k-bw/2, top=view.y+o.y*view.k-bh-10;
  if(top<8) top=view.y+(o.y+o.h)*view.k+10;
  left=clamp(left,8,Math.max(8,cw-bw-8));
  nodebar.style.left=left+'px'; nodebar.style.top=top+'px';
}
(function buildSwatches(){
  const box=$('swatches');
  PALETTE.forEach(c=>{ const b=document.createElement('button'); b.style.setProperty('--c',c); b.dataset.color=c; b.title='換成這個顏色'; b.setAttribute('aria-label','分支顏色 '+c); box.appendChild(b); });
})();
nodebar.addEventListener('pointerdown', e=>e.stopPropagation());
nodebar.addEventListener('click', e=>{
  const sw=e.target.closest('[data-color]');
  if(sw){ setBranchColor(sw.dataset.color); nodebar.classList.remove('colors'); return; }
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act;
  if(a==='edit') startEdit(selectedId);
  else if(a==='child') addChild();
  else if(a==='sibling') addSibling();
  else if(a==='delete') deleteSel();
  else if(a==='collapse') toggleCollapse(selectedId);
  else if(a==='color'){
    const info=idx.get(selectedId);
    $('swatches').querySelectorAll('button').forEach(x=>x.classList.toggle('on', x.dataset.color===(info&&info.color)));
    nodebar.classList.add('colors'); placeBar();
  }
});

/* ---------------- edits ---------------- */
function guard(){ return !store.readOnly && !!cur(); }
function addChild(){
  if(!guard()) return; const info=idx.get(selectedId); if(!info) return;
  if(editingId) commitEdit();
  snapshot();
  const n=mkNode('', info.depth===0? nextColor(info.node):null);
  info.node.collapsed=false; info.node.children.push(n);
  selectedId=n.id; renderMap(); ensureVisible(n.id); startEdit(n.id,null,true); save(currentId);
}
function addSibling(){
  if(!guard()) return; const info=idx.get(selectedId); if(!info) return;
  if(!info.parent) return addChild();
  if(editingId) commitEdit();
  snapshot();
  const p=info.parent, i=p.children.indexOf(info.node);
  const n=mkNode('', info.depth===1? nextColor(cur().root):null);
  p.children.splice(i+1,0,n);
  selectedId=n.id; renderMap(); ensureVisible(n.id); startEdit(n.id,null,true); save(currentId);
}
function deleteSel(){
  if(!guard()) return; const info=idx.get(selectedId); if(!info) return;
  if(!info.parent){ toast('中心主題不能刪除'); return; }
  snapshot();
  const p=info.parent, i=p.children.indexOf(info.node);
  p.children.splice(i,1);
  selectedId = (p.children[i]||p.children[i-1]||p).id;
  renderMap(); save(currentId);
}
function toggleCollapse(id){
  if(!guard()) return; const info=idx.get(id); if(!info||!info.node.children.length) return;
  snapshot(); info.node.collapsed=!info.node.collapsed;
  if(info.node.collapsed && selectedId && isAncestor(id, selectedId)) selectedId=id;
  renderMap(); save(currentId);
}
function setBranchColor(c){
  if(!guard()) return; let info=idx.get(selectedId); if(!info||!info.depth) return;
  while(info.depth>1) info=idx.get(info.parent.id);
  snapshot(); info.node.color=c; renderMap(); save(currentId);
}
function moveNode(id, targetId){
  if(!guard()) return; const a=idx.get(id), t=idx.get(targetId); if(!a||!t||!a.parent) return;
  if(id===targetId || isAncestor(id,targetId) || a.parent.id===targetId) return;
  snapshot();
  a.parent.children.splice(a.parent.children.indexOf(a.node),1);
  if(t.depth===0) a.node.color = a.node.color || nextColor(t.node);
  t.node.collapsed=false; t.node.children.push(a.node);
  selectedId=id; renderMap(); save(currentId);
}

/* ---------------- text editing ---------------- */
function startEdit(id, initial, fresh){
  if(store.readOnly) return; const el=els.get(id), info=idx.get(id); if(!el||!info) return;
  if(editingId && editingId!==id) commitEdit();
  if(!fresh) snapshot();
  editingId=id; editOrig=info.node.text; editFresh=!!fresh; selectedId=id;
  try{ el.contentEditable='plaintext-only'; }catch(e){}
  if(el.contentEditable!=='plaintext-only') el.contentEditable='true';
  el.className+=' editing';
  if(initial!=null){ el.textContent=initial; info.node.text=initial; }
  hideBar(); el.focus({preventScroll:true});
  const r=document.createRange(); r.selectNodeContents(el); if(initial!=null) r.collapse(false);
  const s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
  if(initial!=null) renderMap();
}
function commitEdit(){
  if(!editingId) return; const id=editingId; editingId=null;
  const el=els.get(id), info=idx.get(id);
  if(el){ el.contentEditable='false'; }
  if(info){
    const t=(el?el.textContent:info.node.text).replace(/\s+/g,' ').trim();
    info.node.text=t;
    if(!editFresh && t===editOrig) dropSnapshot(); else save(currentId);
  }
  const sel=window.getSelection(); if(sel) sel.removeAllRanges();
  renderMap();
  canvas.focus({preventScroll:true});
}
world.addEventListener('input', e=>{
  if(!editingId) return; const el=els.get(editingId), info=idx.get(editingId); if(!el||!info) return;
  info.node.text=el.textContent.replace(/\n/g,' ');
  renderMap();
});
world.addEventListener('keydown', e=>{
  if(!editingId) return;
  if(e.isComposing || e.keyCode===229) return;
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); commitEdit(); }
  else if(e.key==='Enter' && e.shiftKey){ e.preventDefault(); }
  else if(e.key==='Tab'){ e.preventDefault(); commitEdit(); addChild(); }
  else if(e.key==='Escape'){ e.preventDefault(); commitEdit(); }
  e.stopPropagation();
});
world.addEventListener('focusout', e=>{ if(editingId && e.target===els.get(editingId)) commitEdit(); });
world.addEventListener('paste', e=>{
  if(!editingId) return; e.preventDefault();
  const t=(e.clipboardData||window.clipboardData).getData('text').replace(/\s+/g,' ');
  document.execCommand('insertText', false, t);
});

/* ---------------- pointer: select / pan / drag / pinch ---------------- */
const ptrs=new Map(); let gesture=null, drag=null, ghost=null;
canvas.addEventListener('pointerdown', e=>{
  if(e.pointerType==='mouse' && e.button!==0) return;
  if(e.target.closest('.zoombar,.empty-state,.nodebar')) return;
  closePops();
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){ endDrag(false); const p=[...ptrs.values()]; gesture={type:'pinch', d:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y), mx:(p[0].x+p[1].x)/2, my:(p[0].y+p[1].y)/2}; return; }
  if(ptrs.size>2) return;
  const chip=e.target.closest('.chip');
  if(chip){ toggleCollapse(chip.dataset.toggle); gesture=null; return; }
  const nodeEl=e.target.closest('.node');
  if(nodeEl){
    const id=nodeEl.dataset.id;
    if(id===editingId) return;
    if(editingId) commitEdit();
    if(selectedId!==id){ selectedId=id; renderMap(); }
    else nodebar.classList.remove('colors');
    canvas.focus({preventScroll:true});
    gesture={type:'press', id, sx:e.clientX, sy:e.clientY};
    return;
  }
  if(editingId) commitEdit();
  if(selectedId){ selectedId=null; renderMap(); }
  canvas.focus({preventScroll:true});
  gesture={type:'pan'}; canvas.classList.add('panning');
});
window.addEventListener('pointermove', e=>{
  if(!ptrs.has(e.pointerId)) return;
  const prev=ptrs.get(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(!gesture) return;
  if(gesture.type==='pinch' && ptrs.size===2){
    const p=[...ptrs.values()], d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y), mx=(p[0].x+p[1].x)/2, my=(p[0].y+p[1].y)/2;
    const r=canvas.getBoundingClientRect();
    view.x+=mx-gesture.mx; view.y+=my-gesture.my;
    zoomAt(mx-r.left, my-r.top, d/Math.max(1,gesture.d));
    gesture.d=d; gesture.mx=mx; gesture.my=my;
  } else if(gesture.type==='pan'){
    view.x+=e.clientX-prev.x; view.y+=e.clientY-prev.y; applyView(); placeBar();
  } else if(gesture.type==='press'){
    if(Math.hypot(e.clientX-gesture.sx,e.clientY-gesture.sy)>6){
      const info=idx.get(gesture.id);
      if(!store.readOnly && info && info.depth>0){ startDrag(gesture.id, e); gesture.type='drag'; }
      else { gesture.type='pan'; canvas.classList.add('panning'); }
    }
  } else if(gesture.type==='drag'){ moveDrag(e); }
});
function upHandler(e){
  if(!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if(gesture && gesture.type==='drag') endDrag(e.type==='pointerup');
  if(ptrs.size===0 || (gesture && gesture.type==='pinch')){ gesture=null; }
  canvas.classList.remove('panning');
}
window.addEventListener('pointerup', upHandler);
window.addEventListener('pointercancel', upHandler);

function startDrag(id, e){
  drag={id, target:null};
  ghost=document.createElement('div'); ghost.className='ghost';
  ghost.textContent=(idx.get(id).node.text||'輸入文字'); document.body.appendChild(ghost);
  hideBar(); moveDrag(e); renderMap();
}
function moveDrag(e){
  if(!drag) return;
  ghost.style.transform=`translate(${e.clientX+12}px,${e.clientY+12}px)`;
  const el=document.elementFromPoint(e.clientX,e.clientY);
  const n=el&&el.closest&&el.closest('.node');
  let t=n&&n.dataset.id||null;
  if(t && (t===drag.id || isAncestor(drag.id,t))) t=null;
  if(t!==drag.target){ drag.target=t; renderMap(); }
}
function endDrag(drop){
  if(!drag) return; const d=drag; drag=null;
  if(ghost){ ghost.remove(); ghost=null; }
  if(drop && d.target) moveNode(d.id, d.target); else renderMap();
}

canvas.addEventListener('dblclick', e=>{
  const n=e.target.closest('.node');
  if(n && n.dataset.id!==editingId){ e.preventDefault(); startEdit(n.dataset.id); }
});
canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  const r=canvas.getBoundingClientRect();
  if(e.ctrlKey||e.metaKey) zoomAt(e.clientX-r.left, e.clientY-r.top, Math.exp(-e.deltaY*0.01));
  else { view.x-=e.deltaX; view.y-=e.deltaY; applyView(); placeBar(); }
},{passive:false});

/* ---------------- keyboard ---------------- */
function nav(key){
  const info=idx.get(selectedId); if(!info) return false; const down=isDown();
  const toP=down?'ArrowUp':'ArrowLeft', toC=down?'ArrowDown':'ArrowRight', prv=down?'ArrowLeft':'ArrowUp', nxt=down?'ArrowRight':'ArrowDown';
  let t=null;
  if(key===toP) t=info.parent;
  else if(key===toC){ const ks=info.node.collapsed?[]:info.node.children; if(ks.length) t=ks[Math.floor((ks.length-1)/2)]; }
  else if((key===prv||key===nxt) && info.parent){ const a=info.parent.children, i=a.indexOf(info.node); t=a[i+(key===nxt?1:-1)]||null; }
  else return false;
  if(t){ selectedId=t.id; renderMap(); ensureVisible(t.id); }
  return true;
}
document.addEventListener('keydown', e=>{
  if(editingId) return;
  const tg=e.target; if(tg && (tg.tagName==='INPUT'||tg.tagName==='TEXTAREA'||tg.isContentEditable)) return;
  const mod=e.metaKey||e.ctrlKey;
  if(e.key==='Escape'){ closePops(); if(selectedId){ selectedId=null; renderMap(); } return; }
  if(!cur()) return;
  if(mod && e.key.toLowerCase()==='z'){ e.preventDefault(); e.shiftKey?doRedo():doUndo(); return; }
  if(mod && e.key.toLowerCase()==='y'){ e.preventDefault(); doRedo(); return; }
  if(mod && (e.key==='='||e.key==='+')){ e.preventDefault(); zoomCenter(1.2); return; }
  if(mod && e.key==='-'){ e.preventDefault(); zoomCenter(1/1.2); return; }
  if(mod && e.key==='0'){ e.preventDefault(); fit(); return; }
  if(!selectedId) {
    if(e.key.startsWith('Arrow') || e.key==='Tab'){ if(tg===canvas){ e.preventDefault(); selectedId=cur().root.id; renderMap(); } }
    return;
  }
  if(e.key.startsWith('Arrow')){ if(nav(e.key)) e.preventDefault(); return; }
  if(store.readOnly) return;
  switch(e.key){
    case 'Tab': e.preventDefault(); addChild(); break;
    case 'Enter': e.preventDefault(); addSibling(); break;
    case 'Delete': case 'Backspace': e.preventDefault(); deleteSel(); break;
    case 'F2': e.preventDefault(); startEdit(selectedId); break;
    case ' ': e.preventDefault(); toggleCollapse(selectedId); break;
    default:
      if(e.key.length===1 && !mod && !e.altKey){ e.preventDefault(); startEdit(selectedId, e.key); }
  }
});

/* ---------------- sidebar ---------------- */
function sortedMaps(){ return [...maps.values()].sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)); }
function renderSidebar(){
  const q=$('search').value.trim().toLowerCase();
  const all=sortedMaps(); const list=all.filter(m=>!q||(m.title||'').toLowerCase().includes(q));
  const box=$('pages'); box.innerHTML='';
  $('count').textContent=all.length?String(all.length):'';
  if(!list.length){
    const d=document.createElement('div'); d.className='no-pages';
    d.textContent = q ? '找不到符合的心智圖' : (ready ? '還沒有心智圖，按上方「新增心智圖」開始' : '');
    box.appendChild(d);
  }
  for(const m of list){
    const row=document.createElement('div'); row.className='page'+(m.id===currentId?' active':''); row.dataset.id=m.id; row.tabIndex=0; row.setAttribute('role','button');
    const i=document.createElement('span'); i.className='pi'; i.textContent=m.icon||'🧠';
    const t=document.createElement('span'); t.className='pt'; t.textContent=m.title||'未命名心智圖';
    row.append(i,t);
    if(!store.readOnly){
      const mb=document.createElement('button'); mb.className='icon-btn more'; mb.title='更多'; mb.setAttribute('aria-label','更多選項'); mb.dataset.more=m.id;
      mb.innerHTML='<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><circle cx="3.5" cy="8" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="12.5" cy="8" r="1.4"/></svg>';
      row.appendChild(mb);
    }
    box.appendChild(row);
  }
  $('newBtn').disabled=store.readOnly||!ready;
}
$('pages').addEventListener('click', e=>{
  const mb=e.target.closest('[data-more]');
  if(mb){ e.stopPropagation(); openPageMenu(mb.dataset.more, mb); return; }
  const row=e.target.closest('.page'); if(row) goto(row.dataset.id);
});
$('pages').addEventListener('keydown', e=>{ if(e.key==='Enter' && e.target.classList.contains('page')) goto(e.target.dataset.id); });
$('search').addEventListener('input', renderSidebar);
$('newBtn').addEventListener('click', ()=>createMap(false));

function createMap(sample){
  if(store.readOnly||!ready) return;
  const m=makeMap(sample);
  const last=sortedMaps().pop(); if(last && m.createdAt<=last.createdAt) m.createdAt=last.createdAt+1;
  maps.set(m.id,m); save(m.id,true);
  goto(m.id);
  if(!sample){ setTimeout(()=>{ $('title').focus(); $('title').select(); }, 50); }
}
function goto(id){
  if(location.hash.slice(1)!==id) location.hash=id;
  openMap(id);
  if(isMobile()) app.classList.add('side-closed');
}
function openMap(id){
  if(editingId) commitEdit();
  if(!maps.has(id)) id=null;
  const changed=id!==currentId;
  currentId=id;
  if(changed){ for(const el of els.values()) el.remove(); els.clear(); }
  const m=cur();
  selectedId = m ? m.root.id : null;
  syncHeader(); renderSidebar(); renderMap();
  if(changed && m) fit();
}
function syncHeader(){
  const m=cur();
  $('title').value = m ? (m.title||'') : '';
  $('title').disabled = !m || store.readOnly;
  $('crumbIcon').textContent = m ? (m.icon||'🧠') : '🧠';
  $('crumbIcon').disabled = !m || store.readOnly;
  $('layDown').classList.toggle('on', !!m && m.layout!=='right');
  $('layRight').classList.toggle('on', !!m && m.layout==='right');
  document.title = m ? `${m.title||'未命名心智圖'} | YoZu 心智圖` : 'YoZu 心智圖';
}
$('title').addEventListener('input', ()=>{ const m=cur(); if(!m||store.readOnly) return; m.title=$('title').value; document.title=`${m.title||'未命名心智圖'} | YoZu 心智圖`; renderSidebar(); save(m.id); });
$('title').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); canvas.focus(); } });
function setLayout(l){ const m=cur(); if(!m||store.readOnly||m.layout===l) return; m.layout=l; syncHeader(); renderMap(); fit(); save(m.id); }
$('layDown').addEventListener('click', ()=>setLayout('down'));
$('layRight').addEventListener('click', ()=>setLayout('right'));

/* side toggling */
$('closeSide').addEventListener('click', ()=>app.classList.add('side-closed'));
$('openSide').addEventListener('click', ()=>app.classList.toggle('side-closed'));
$('scrim').addEventListener('click', ()=>app.classList.add('side-closed'));
if(isMobile()) app.classList.add('side-closed');
app.addEventListener('transitionend', e=>{ if(e.target===$('side')){ placeBar(); } });

/* ---------------- popovers ---------------- */
let menuFor=null;
function closePops(){ document.querySelectorAll('.pop.show').forEach(p=>p.classList.remove('show')); const d=$('pageMenu').querySelector('[data-m="del"]'); d.classList.remove('armed'); d.textContent='🗑️ 刪除'; }
function showPop(p, anchor, align){
  closePops(); p.classList.add('show');
  const r=anchor.getBoundingClientRect(), w=p.offsetWidth, h=p.offsetHeight;
  let left = align==='right' ? r.right-w : r.left; let top=r.bottom+6;
  left=clamp(left,8,innerWidth-w-8); if(top+h>innerHeight-8) top=Math.max(8,r.top-h-6);
  p.style.left=left+'px'; p.style.top=top+'px';
}
function openPageMenu(id, anchor){ menuFor=id; showPop($('pageMenu'), anchor); }
$('pageMenu').addEventListener('click', e=>{
  const b=e.target.closest('[data-m]'); if(!b||!menuFor) return; e.stopPropagation();
  const m=maps.get(menuFor); if(!m) return closePops();
  if(b.dataset.m==='rename'){ closePops(); goto(m.id); setTimeout(()=>{ $('title').focus(); $('title').select(); },60); }
  else if(b.dataset.m==='dup'){
    closePops(); const c=JSON.parse(JSON.stringify(m)); c.id=uid('m'); c.title=(m.title||'未命名心智圖')+' 的副本'; c.root=cloneWithNewIds(c.root);
    const last=sortedMaps().pop(); c.createdAt=Math.max(Date.now(), (last?last.createdAt:0)+1); c.rev='';
    maps.set(c.id,c); save(c.id,true); goto(c.id); toast('已建立副本');
  }
  else if(b.dataset.m==='del'){
    if(!b.classList.contains('armed')){ b.classList.add('armed'); b.textContent='再按一次確定刪除'; return; }
    closePops(); deleteMap(m.id);
  }
});
function deleteMap(id){
  const wasCur=id===currentId; maps.delete(id); undoS.delete(id); redoS.delete(id);
  removeRemote(id);
  if(wasCur){ const first=sortedMaps()[0]; if(first) goto(first.id); else { history.replaceState(null,'',location.pathname+location.search); openMap(null); } }
  else renderSidebar();
  toast('已刪除心智圖');
}
(function buildIcons(){
  const g=$('iconGrid'); ICONS.forEach(ic=>{ const b=document.createElement('button'); b.textContent=ic; b.dataset.icon=ic; g.appendChild(b); });
})();
$('crumbIcon').addEventListener('click', e=>{ e.stopPropagation(); if(!cur()||store.readOnly) return; showPop($('iconPop'), $('crumbIcon')); });
$('iconGrid').addEventListener('click', e=>{ const b=e.target.closest('[data-icon]'); const m=cur(); if(!b||!m) return; m.icon=b.dataset.icon; syncHeader(); renderSidebar(); save(m.id); closePops(); });
$('shareBtn').addEventListener('click', e=>{
  e.stopPropagation();
  const t=$('shareText');
  if(store.mode==='cloud'){
    t.innerHTML='';
    const p1=document.createTextNode('用這個作品頁面上的「分享」功能複製連結。連結會記住目前打開的這張圖（網址結尾的 ');
    const c=document.createElement('code'); c.textContent='#'+(currentId||'');
    const p2=document.createTextNode('），對方打開就會直接看到它。有權限的人也能在左側看到其他心智圖。');
    t.append(p1,c,p2);
  } else {
    t.textContent='目前資料只存在這個瀏覽器裡，分享出去對方看不到內容。在 Claude 上打開這個作品並登入後，心智圖就會同步到雲端並可以分享。';
  }
  showPop($('sharePop'), $('shareBtn'), 'right');
});
document.addEventListener('pointerdown', e=>{ if(!e.target.closest('.pop') && !e.target.closest('[data-more]') && e.target!==$('crumbIcon') && !e.target.closest('#shareBtn')) closePops(); });

/* zoom bar */
$('zIn').addEventListener('click', ()=>zoomCenter(1.2));
$('zOut').addEventListener('click', ()=>zoomCenter(1/1.2));
$('zLabel').addEventListener('click', ()=>zoomCenter(1/view.k));
$('zFit').addEventListener('click', fit);

/* empty state */
function updateEmpty(){
  const box=$('empty'), has=!!cur();
  box.classList.toggle('show', !has);
  $('hint').style.visibility = has && !store.readOnly ? '' : 'hidden';
  document.querySelector('.zoombar').style.visibility = has ? '' : 'hidden';
  if(has) return;
  if(!ready){ $('emptyTitle').textContent='載入中…'; $('emptyText').textContent=''; $('emptyRow').hidden=true; return; }
  if(store.readOnly){ $('emptyTitle').textContent='目前沒有心智圖'; $('emptyText').textContent='這個工作區還沒有任何心智圖。'; $('emptyRow').hidden=true; return; }
  $('emptyTitle').textContent='還沒有心智圖';
  $('emptyText').textContent='每張心智圖都是左側的一個頁面。建立後用 Tab 長出子節點、Enter 新增同層，雙擊文字就能改。';
  $('emptyRow').hidden=false;
}
$('emptyNew').addEventListener('click', ()=>createMap(false));
$('emptySample').addEventListener('click', ()=>createMap(true));

function applyReadOnly(){
  $('roBadge').hidden=!store.readOnly; syncHeader(); renderSidebar(); setStatus(); placeBar(); updateEmpty();
}

/* toast */
let toastT=null;
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2400); }

/* hash routing */
window.addEventListener('hashchange', ()=>{ const h=location.hash.slice(1); if(h && maps.has(h) && h!==currentId) openMap(h); });
window.addEventListener('resize', ()=>{ placeBar(); });

/* ---------------- boot ---------------- */
function afterLoad(){
  ready=true;
  const h=location.hash.slice(1);
  const target = maps.has(h) ? h : (sortedMaps()[0]||{}).id || null;
  if(target && location.hash.slice(1)!==target && maps.has(h)===false && h) history.replaceState(null,'','#'+target);
  openMap(target); setStatus(); applyReadOnly();
}
let firstSnap=true;
function onSnap(snap){
  const seen=new Set(); let curChanged=false;
  for(const d of snap.docs){
    const data=d.data(); if(!data||!data.root) continue; seen.add(d.id);
    const local=maps.get(d.id);
    if(local && data.rev && myRevs.has(data.rev)) continue;
    if(local && (isBusy(d.id) || (d.id===currentId && (editingId||drag)))) continue;
    if(local && local.rev===data.rev && data.rev) continue;
    const copy=JSON.parse(JSON.stringify(data)); copy.id=d.id; copy.root=sanitize(copy.root);
    maps.set(d.id, copy);
    if(d.id===currentId) curChanged=true;
  }
  if(!firstSnap){
    for(const id of [...maps.keys()]) if(!seen.has(id) && !isBusy(id)) { maps.delete(id); if(id===currentId) curChanged=true; }
  }
  if(firstSnap){ firstSnap=false; afterLoad(); return; }
  renderSidebar();
  if(curChanged){
    if(!cur()){ const f=sortedMaps()[0]; openMap(f?f.id:null); }
    else { syncHeader(); renderMap(); if(!idx.has(selectedId)) selectedId=null; placeBar(); }
  }
}
async function init(){
  updateEmpty(); renderSidebar(); setStatus();
  let db=null, user=null;
  try{
    if(window.claude && typeof window.claude.use==='function'){
      [db,user]=await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    }
  }catch(e){ db=null; }
  if(db){
    store.mode='cloud'; store.db=db;
    if(user){ try{ const c=await user.can('data.write'); if(c===false) store.readOnly=true; }catch(e){} }
    db.collection('maps').onSnapshot(onSnap, err=>{
      if(err && err.code==='revoked'){ store.readOnly=true; applyReadOnly(); }
      else toast('同步中斷了，重新整理頁面就能恢復');
      if(firstSnap){ firstSnap=false; afterLoad(); }
    });
  } else {
    store.mode='local';
    lsLoad().forEach(m=>{ if(m&&m.id&&m.root){ m.root=sanitize(m.root); maps.set(m.id,m); } });
    afterLoad();
  }
}
if(document.fonts && document.fonts.ready){ document.fonts.ready.then(()=>{ mcache.clear(); if(cur()) renderMap(); }); }
init();
})();
</script>
